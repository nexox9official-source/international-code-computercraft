name: Lua validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      - name: Check Lua syntax
        run: |
          set -e
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.3 -p "$file"
          done

      - name: Run project self-test
        run: |
          lua5.3 tests/selftest.lua

      - name: Verify initial legal corpus
        run: |
          set -e
          count=$(grep -hE '^\{[0-9]+,' international_code/seed/*.lua | wc -l)
          echo "Seed articles: $count"
          test "$count" -eq 500
          grep -q '^\{1,' international_code/seed/001.lua
          grep -q '^\{500,' international_code/seed/005.lua


      - name: Verify North Coalition national corpus
        run: |
          set -e
          test -f international_code/national/corpus_v2.json
          count=$(grep -o '"id": "NC-ART-[0-9][0-9][0-9]"' international_code/national/corpus_v2.json | wc -l)
          echo "North Coalition articles: $count"
          test "$count" -eq 400
          grep -q '"category_count": 20' international_code/national/corpus_v2.json
          grep -q '"founding_phase_account": "NexoFr_"' international_code/national/corpus_v2.json
          forbidden="Astra""lium"
          ! grep -R -q --exclude-dir=.git "$forbidden" .
